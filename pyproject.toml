[project]
name = "nigrains"
version = "0.10.0"
description = "Virtual actors for asyncio: grains addressed by identity, activated on demand."
readme = "README.md"
requires-python = ">=3.14"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Sergey Ilyevich" }]
keywords = ["actors", "virtual-actors", "grains", "asyncio", "orleans"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

# Deliberately none. A runtime whose whole job is to decide when an object
# exists has no business bringing anything with it, and the moment it does,
# the "extract it and use it anywhere" property this package exists for is
# gone. Distribution arrives as an extra, behind a port, and never as a hard
# requirement: a single-node user pays nothing for a cluster they do not run.
dependencies = []

[project.optional-dependencies]
http = ["httpx>=0.28"]
valkey = ["redis>=5.2"]

[project.urls]
Homepage = "https://github.com/yadozub/nigrains"
Source = "https://github.com/yadozub/nigrains"
Issues = "https://github.com/yadozub/nigrains/issues"
Changelog = "https://github.com/yadozub/nigrains/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nigrains"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
    "mypy>=1.14",
    # The extras, so the suite exercises what a user of them would get.
    "httpx>=0.28",
    "redis>=5.2",
    "testcontainers>=4.9",
]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "D", "ANN"]
ignore = ["D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Test doubles are read top to bottom and their names say what they are; a
# docstring on every method of a fake would be noise between the reader and
# the behaviour. The tests themselves keep D103 where they have something to
# say, and say it.
"tests/*" = ["ANN401", "D101", "D102", "D103", "D105", "D107", "D205"]
# The benchmark's grains are one-line props whose names say what they are.
"bench/*" = ["D101", "D102", "D107"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
